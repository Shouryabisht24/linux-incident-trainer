# OPTIONAL overlay — NOT auto-loaded by `docker compose up` and NOT merged
# into docker-compose.yml or docker-compose.override.yml. The default,
# steady-state stack stays local-only HTTP with zero forced changes; this
# file only takes effect if you explicitly pass it with `-f`. See the
# README's "TLS / exposing beyond localhost (opt-in)" section for the full
# requirements and warnings before using this.
#
# Adds a Caddy reverse proxy in front of the existing frontend/backend
# services for automatic Let's Encrypt TLS. Caddy is used specifically
# because it obtains and renews certificates itself via the HTTP-01
# challenge with no manual certbot/cron/renewal-hook setup — the Caddyfile
# below is the entire TLS configuration.
#
# Usage:
#   cp Caddyfile.example Caddyfile      # edit `example.com` to your real domain
#   docker compose -f docker-compose.yml -f docker-compose.tls-example.yml up -d --build
#
# Requirements (see README):
#   - A real domain name with an A/AAAA record pointed at this host's public IP.
#   - Ports 80 and 443 reachable from the internet (for the HTTP-01 challenge
#     and HTTPS traffic itself) — e.g. forwarded through your router/firewall.
#   - This does NOT change the docker.sock root-equivalent-to-host risk
#     documented in decisions/0001 and the README's Security notes. TLS only
#     encrypts the transport; put a VPN/Tailscale layer in front regardless,
#     per the existing warning, before exposing this beyond your own LAN.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  # Caddy becomes the sole internet-facing entrypoint once it's in front, so
  # stop publishing these services' host ports directly — otherwise plain
  # HTTP on 3000/4000 would remain reachable alongside Caddy's TLS on 443
  # anywhere your router/firewall forwards them.
  #
  # `!reset` clears an inherited list instead of appending to it (Compose's
  # default merge behavior for `ports` across `-f` files is to concatenate,
  # not replace). Requires Docker Compose v2.24.0+ (Jan 2024) — run
  # `docker compose version` to check. On an older Compose, `!reset` is not
  # recognized: comment the `ports:` lines out of docker-compose.yml directly
  # instead for the duration you're running behind this overlay.
  frontend:
    ports: !reset []

  backend:
    ports: !reset []

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
