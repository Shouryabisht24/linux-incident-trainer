server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Using a variable in proxy_pass (below)
    # forces nginx to resolve "backend" lazily per-request instead of once
    # at config load — otherwise nginx refuses to start if the backend
    # container isn't up yet, or keeps a stale IP after it restarts.
    resolver 127.0.0.11 valid=10s;

    location / {
        # Security headers for the static frontend only. Deliberately scoped
        # to this location block, NOT set at the server level: nginx does
        # not merge server-level add_header directives into a location that
        # defines its own, but to be unambiguous (and to guarantee these
        # never leak onto the /api/ or /ws/ proxied responses below) they are
        # added here and only here. The backend's own helmet config
        # (backend/src/index.ts) is the sole source of these headers for
        # anything proxied to it — see decisions/0035 for the reasoning
        # behind matching this exact CSP policy on both layers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Same policy reasoning as backend/src/index.ts's helmet CSP:
        # style-src allows inline styles because the hand-built spotlight
        # -glow/tilt/magnetic-button/shiny-text/click-spark effects set
        # inline styles via React `style={{...}}` and direct
        # `element.style.setProperty(...)`; connect-src allows ws:/wss: for
        # the same-origin terminal WebSocket; font-src is 'self' only since
        # all @fontsource webfonts are self-hosted; img-src allows data: for
        # the one inline SVG noise-texture background in styles.css. No
        # upgrade-insecure-requests, for the same reason as the backend: the
        # default steady-state stack here is plain HTTP with a ws:// (not
        # wss://) terminal socket, and forcing an upgrade would break it.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }

    # NOTE: proxy_pass targets below deliberately omit any URI after the
    # variable. Per nginx's proxy_pass semantics, once a variable is
    # involved, pairing it with a literal URI (e.g. "$upstream_backend/api/")
    # does NOT splice the matched location prefix back in the way a
    # non-variable proxy_pass would — it replaces the *entire* request URI
    # with that literal, so a request for /api/categories was actually being
    # forwarded upstream as bare /api/, breaking every API route (and every
    # WS path) in the real production/nginx pipeline. Omitting the URI
    # entirely forwards the original request URI unchanged instead, which is
    # what we want here since Express/the WS upgrade handler already listen
    # on the exact same paths (/health, /api/*, /ws/*).
    location /health {
        set $upstream_backend http://backend:4000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
    }

    location /api/ {
        set $upstream_backend http://backend:4000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
    }

    location /ws/ {
        set $upstream_backend http://backend:4000;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
