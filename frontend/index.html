<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practice real Linux production incidents in a live terminal, inside a genuinely broken Docker container. Free and self-hosted."
    />
    <meta name="theme-color" content="#f2f4f8" />
    <!-- The two self-hosted @fontsource files needed at first paint (body text + hero display
         headline); every other weight loads normally via the CSS the JS bundle imports. Paths are
         deterministic (see vite.config.ts's assetFileNames override for font files) so they match
         the actual built @font-face src exactly, in dev and in the production build alike — see
         decisions/0018-visual-identity-pass.md. -->
    <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/overpass-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Linux Incident Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
